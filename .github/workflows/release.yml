# Publishes the recall skill as a GitHub release asset when a v* tag is pushed.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Write the version of the tag into the skill
        run: |
          sed -i "0,/^  version: .*/s//  version: ${GITHUB_REF_NAME#v}/" skills/recall/SKILL.md
          grep -q "^  version: ${GITHUB_REF_NAME#v}$" skills/recall/SKILL.md
      - name: Lint the flow with the latest lnl release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo dsl400/lnl --pattern lnl.mjs
          node lnl.mjs lint skills/recall/SKILL.md
      - name: Check the script
        run: node --check skills/recall/recall.mjs
      - name: Pack the skill
        run: |
          mkdir -p pack/recall && cp -r skills/recall/. pack/recall/
          tar -czf recall.tar.gz -C pack recall
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" recall.tar.gz skills/recall/SKILL.md --title "$GITHUB_REF_NAME" --generate-notes
